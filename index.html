<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <meta name="description" content="Try the Kendo UI Admin Dashboard demo. Explore charts, grids, and interactive panels that showcase responsive layouts and real-time data views.">

    <link rel="icon" type="image/x-icon" href="/kendo-ui/content/favicon/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/@progress/kendo-theme-meridian@14.5.0/dist/all.css" />
    <link rel="stylesheet" href="Content/site.css" />

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
    <script src="https://kendo.cdn.telerik.com/2026.1.212/js/kendo.all.min.js"></script>
</head>

<body>
    <script id="notification-body" type="text/x-kendo-template">
        <div class="notification-item" style="padding: 18px 16px 13px 16px; border-bottom: 1px solid rgba(0,0,0,.08);">
            <span class="badge-missed"></span>
            <div class="user-photo" style="background-image: url(Content/Employees-images/9.jpg); margin:0px 16px 0px 8px;"></div>
            <div class="customer-name">
                <div style="font-size: 18px">Rudolf joined the Team</div>
                <div style="font-size: 14px; color: \#8F8F8F">Congratulate her</div>
            </div>
        </div>
        <div class="notification-item" style="padding: 13px 16px 13px 16px; border-bottom: 1px solid rgba(0,0,0,.08);">
            <span class="badge-missed"></span>
            <div class="user-photo" style="background-image: url(Content/Employees-images/4.jpg); margin:0px 16px 0px 8px;"></div>
            <div class="customer-name">
                <div style="font-size: 18px">Joy invited you to the class</div>
                <div style="font-size: 14px; color: \#8F8F8F">You have 3 more messages from Joy</div>
            </div>
        </div>
        <div class="notification-item" style="padding: 13px 16px 13px 16px; background-color: rgba(66, 66, 66, 0.04); border-bottom: 1px solid rgba(0,0,0,.08);">
            <div class="user-photo" style="background-image: url(Content/images/initials.jpg); margin:0px 16px 0px 8px;"></div>
            <div class="customer-name">
                <div style="font-size: 18px">Your order has been shipped</div>
                <div style="font-size: 14px; color: \#8F8F8F">MD Inc. order update</div>
            </div>
        </div>
        <div class="notification-actions">
            <button id="mark-as-read">Mark all as read</button>
            <a class="app-route" data-page="notifications.html" data-title="Notifications" href="#notifications">View all notifications</a>
        </div>
      </script>

    <script id="notification-header" type="text/x-kendo-template">
        <div class="notification-header">
            <div style="font-size: 19px">Notifications</div>
            <div class="notification-header__spacer"></div>
            <div id="new-count">2 New</div>
        </div>
      </script>

    <div id="drawer">
        <div id="drawer-content">
            <div id="appbar"></div>
            <main></main>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            function loadPage(page, title) {
                $("main").load(page, function (_, status) {
                    if (status === "error") {
                        $("main").load("404.html");
                        title = "Page not found";
                    }

                    document.title = title + " - Admin Dashboard";
                    $("div.appTitle").text(title);
                });
            }

            loadPage("dashboard.html", "Overview");
            $("#appbar").kendoAppBar({
                themeColor: "inherit",
                items: [
                    { template: '<a id="toggleDrawer" aria-label="Toggle navigation" class="k-button k-button-md k-button-rectangle k-rounded-md k-button-solid k-button-solid-base" style="border:0px; background:\\#FFFFFF;" href="\\#"><span id="menu"></span></a>', type: "contentItem" },
                    { template: '<div class="appTitle" style="color:\\#2D73F5; font-size:18px;">Overview</div>', type: "contentItem" },
                    { width: 0, type: "spacer" },
                    { template: "<a class='k-link app-bar-link' aria-label='Open notifications'><span id='notification'><span data-role='badge' class='k-badge k-badge-solid k-badge-error k-badge-md k-badge-dot k-badge-outside k-top-end'></span></span></a>", type: "contentItem" },
                    { width: 26, type: "spacer" },
                    { template: "<a class='k-link app-bar-link aboutPage'>About</a>" }
                ]
            }).on("click", ".aboutPage", function (e) {
                e.preventDefault();
                $("div.k-drawer-items").find(".k-state-selected").removeClass("k-state-selected");
                loadPage("about.html", "About");
            });

            var drawer = $("#drawer").kendoDrawer({
                template: "<ul> \
                            <li data-role='drawer-item' class='k-state-selected' data-page='dashboard.html' data-title='Overview'><span id='grid'></span><span class='k-item-text'>Dashboard</span></li> \
                            <li data-role='drawer-item' data-page='performance.html' data-title='Performance & Sales'><span id='globe'></span><span class='k-item-text'>Performance & Sales</span></li> \
                            <li data-role='drawer-item' data-page='products.html' data-title='Products'><span id='aggregate-fields'></span><span class='k-item-text'>Products</span></li> \
                            <li data-role='drawer-item' data-page='notifications.html' data-title='Notifications'><span id='bell'></span><span class='k-item-text'>Notifications</span></li> \
                            <li data-role='drawer-separator'></li> \
                            <li data-role='drawer-item' data-page='profile.html' data-title='Profile'><span id='user'></span><span class='k-item-text'>Profile</span></li> \
                            <li data-role='drawer-item' data-page='settings.html' data-title='Settings'><span id='gear'></span><span class='k-item-text'>Settings</span></li> \
                            <li data-role='drawer-item' data-page='help.html' data-title='Help & Support'><span id='question-circle'></span><span class='k-item-text'>Help & Support</span></li> \
                          </ul>",
                mode: "push",
                autoCollapse: false,
                mini: false,
                itemClick: function (e) {
                    if (!e.item.hasClass("k-drawer-separator")) {
                        loadPage(e.item.data("page"), e.item.data("title"));

                        if ($(window).width() < 992) {
                            var drawerInstance = e.sender;
                            drawerInstance.hide();
                        }
                    }
                },
                position: 'left',
                width: 240,
                swipeToOpen: true
            }).getKendoDrawer();

            var userContentTemplate = kendo.template("\
                    <div class='user-container' style='text-align: center;'> \
                        <img id='avatar' src='Content/Avatar/avatar.png' /> \
                        <a class='app-route profile-link' data-page='profile.html' data-title='Profile' href='#profile'>Jaxons Danniels</a> \
                        <div style='text-decoration-line: underline; font-size: 12px;'>jaxons.daniels@company.com</div> \
                        <button id='signOutButton'>Sign Out</button> \
                    </div>");
            drawer.drawerWrapper.prepend(userContentTemplate);

            kendo.ui.icon($("#menu"), { icon: 'menu' });
            kendo.ui.icon($("#notification"), { icon: 'bell' });
            kendo.ui.icon($("#grid"), { icon: 'grid' });
            kendo.ui.icon($("#globe"), { icon: 'globe' });
            kendo.ui.icon($("#aggregate-fields"), { icon: 'aggregate-fields' });
            kendo.ui.icon($("#bell"), { icon: 'bell' });
            kendo.ui.icon($("#user"), { icon: 'user' });
            kendo.ui.icon($("#gear"), { icon: 'gear' });
            kendo.ui.icon($("#question-circle"), { icon: 'question-circle' });

            $("#drawer").on("click", ".app-route", function (e) {
                e.preventDefault();
                loadPage($(this).data("page"), $(this).data("title"));
            });

            $("#appbar").kendoPopover({
                showOn: "click",
                filter: ".k-svg-i-bell",
                width: "400px",
                height: "392px",
                position: "bottom",
                header: kendo.template($("#notification-header").html()),
                body: kendo.template($("#notification-body").html()),
                show: function (e) {
                    $("#new-count").kendoBadge({
                        themeColor: "warning",
                        shape: "rectangle"
                    });

                    $('.badge-missed').kendoBadge({
                        themeColor: 'warning',
                        shape: 'circle',
                        size: 'small'
                    });

                    $("#mark-as-read").kendoButton({
                        click: function () {
                            $(".k-badge-dot").remove();
                            $('.badge-missed').remove();
                            $("#new-count").text("0 New");
                            $(".notification-item").css("background-color", "rgba(66, 66, 66, 0.04)")
                        }
                    });
                }
            });

            $("#signOutButton").kendoButton({
                click: signOut
            });

            function signOut() {
                location.href = "login.html";
            };

            $("#drawer").data("kendoDrawer").show();

            $("#toggleDrawer").click(function () {
                var drawerInstance = $("#drawer").data("kendoDrawer");
                var drawerContainer = drawerInstance.drawerContainer;

                if (drawerContainer.hasClass("k-drawer-expanded")) {
                    drawerInstance.hide();
                } else {
                    drawerInstance.show();
                };

                setTimeout(function () {
                    kendo.resize($(".k-chart"));
                }, 350);
            });

            if ($(window).width() < 992) {
                setTimeout(function () {
                    var drawerInstance = $("#drawer").data("kendoDrawer");
                    drawerInstance.hide();
                });
            };
        });
    </script>

    <style>
        body {
            margin: 0px;
            font-family: var(--kendo-font-family);
            font-style: normal;
            font-weight: normal;
        }

        #appbar {
            padding: 0px 25px 0px 24px;
            height: 48px;
            background: var(--kendo-color-surface-alt);
            box-shadow: var(--kendo-elevation-1);
        }

        #avatar {
            margin: 32px auto 0;
            width: 64px;
            border-radius: 50%;
        }

        #signOutButton {
            pointer-events: auto;
            margin: 12px 0 9px 0;
            background: var(--kendo-color-base-emphasis);
        }

        #drawer-content {
            background-color: var(--kendo-color-app-surface);
        }

        .k-popover-callout {
            display: none;
        }

        .k-popover-body {
            padding: 0px;
        }

        .user-photo {
            display: inline-block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-size: 60px 64px;
            background-position: center center;
            vertical-align: middle;
            line-height: 64px;
            box-shadow: inset 0 0 1px #999, inset 0 0 10px rgba(0, 0, 0, 0.2);
            margin-left: 5px;
        }

        .customer-name {
            display: inline-block;
            vertical-align: middle;
            padding-left: 3 px;
        }

        .profile-link {
            display: block;
            margin: 8px 0;
            color: var(--kendo-color-on-surface);
            font-size: var(--kendo-font-size-sm);
            font-weight: var(--kendo-font-weight-semibold);
        }

        .notification-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--kendo-spacing-4);
        }

        .notification-actions .app-route {
            color: var(--kendo-color-info-on-surface);
        }
    </style>
</body>

</html>
